<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06041A}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
.glass{background:rgba(24,16,64,.52);border:1px solid rgba(167,139,250,.32);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.lt .glass{background:rgba(255,255,255,.62);border-color:rgba(109,40,217,.22)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 30px rgba(124,58,237,.75)) drop-shadow(0 0 70px rgba(34,211,238,.25))}50%{filter:drop-shadow(0 0 50px rgba(124,58,237,.95)) drop-shadow(0 0 110px rgba(34,211,238,.4))}}
@keyframes stage{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.cr{transition:transform .35s cubic-bezier(.2,.9,.3,1.4),opacity .5s,filter .35s}
.cr:hover{transform:scale(1.08)}
.fl{animation:float 6s ease-in-out infinite}
.orb{animation:breathe 5s ease-in-out infinite}
.orbspin{animation:spin 120s linear infinite}
@keyframes oglow{0%,100%{filter:drop-shadow(0 0 2px rgba(196,181,253,.7)) drop-shadow(0 0 7px rgba(139,92,246,.55));opacity:.72}50%{filter:drop-shadow(0 0 3px rgba(224,242,254,.85)) drop-shadow(0 0 11px rgba(139,92,246,.75));opacity:.88}}
.orbitglow{animation:oglow 4s ease-in-out infinite;-webkit-mask-image:linear-gradient(90deg,transparent 12%,#000 30%);mask-image:linear-gradient(90deg,transparent 12%,#000 30%)}
@keyframes orun{from{offset-distance:0%}to{offset-distance:100%}}
.odot{position:absolute;left:0;top:0;border-radius:50%;offset-rotate:0deg;offset-anchor:center;animation-name:orun;animation-timing-function:linear;animation-iteration-count:infinite;pointer-events:none}
.trav{animation:spin 11s linear infinite}
.trav2{animation:spinr 16s linear infinite}
.tw{animation:twinkle 3.2s ease-in-out infinite}
.stage{animation:stage 3.4s ease-in-out infinite}
.msg{animation:rise .6s ease-out both}
.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both}
.dcard{transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.dcard:hover{transform:perspective(900px) rotateX(-6deg) rotateY(0deg) translateY(-10px)!important}
.nav a:hover{background:rgba(124,58,237,.25)}
a:focus-visible,button:focus-visible{outline:2px solid #22D3EE;outline-offset:2px}
.lt a:focus-visible,.lt button:focus-visible{outline-color:#0E7490}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rsm{background:rgba(14,11,38,.78);border:1.5px solid rgba(196,181,253,.45);box-shadow:inset 0 0 14px rgba(139,92,246,.3),0 0 14px rgba(124,58,237,.25);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.bp{background:linear-gradient(180deg,rgba(88,60,200,.55) 0%,rgba(44,26,112,.78) 100%);border:1.5px solid rgba(196,181,253,.9);color:#FFFFFF;box-shadow:inset 0 0 14px rgba(196,181,253,.45),inset 0 1px 0 rgba(255,255,255,.35),0 0 16px rgba(139,92,246,.75)}
.bs{background:rgba(14,11,38,.6);border:1px solid rgba(255,255,255,.16);color:#F5F3FF;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bs:hover{border-color:rgba(196,181,253,.6)}
.tb{animation:pop .25s ease-out both}
.hint{animation:float 3s ease-in-out infinite}
.mini-pl{animation:spin 12s linear infinite}
.world{transition:transform .25s ease-out}
.card{touch-action:none;user-select:none;transition:box-shadow .2s}
.lnk{transform-origin:0 50%;border-radius:2px;opacity:.9}
</style>
</helmet>
<div class="{{T.cls}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}" style="width:1440px;height:900px;position:relative;overflow:hidden;background:{{T.bg}};color:{{T.text}};font-family:'Inter',system-ui,sans-serif">
<img src="/_blob/42f83192f57abb44ac4cfbe3bd649a21" alt="" aria-hidden="true" style="position:absolute;inset:0;width:1440px;height:900px;object-fit:cover;filter:{{T.bgFilter}}">
<div aria-hidden="true" style="position:absolute;inset:0;background:{{T.veil}}"></div>
<sc-for list="{{stars}}" as="s" hint-placeholder-count="40">
<span class="tw" aria-hidden="true" style="position:absolute;left:{{s.x}}px;top:{{s.y}}px;width:{{s.r}}px;height:{{s.r}}px;border-radius:50%;background:#FFFFFF;animation-delay:{{s.d}}s"></span>
</sc-for>

<div onPointerDown="{{panStart}}" aria-hidden="true" style="position:absolute;inset:0;cursor:{{cursor}};background-image:radial-gradient({{T.dot}} 1.2px,transparent 1.2px);background-size:{{grid.s}}px {{grid.s}}px;background-position:{{grid.x}}px {{grid.y}}px"></div>

<div class="world" style="position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;transform:translate({{w.x}}px,{{w.y}}px) scale({{w.z}});pointer-events:none">
<sc-for list="{{links}}" as="l" hint-placeholder-count="6">
<div class="lnk" aria-hidden="true" style="position:absolute;left:{{l.x}}px;top:{{l.y}}px;width:{{l.len}}px;height:1.5px;transform:rotate({{l.a}}deg);background:linear-gradient(90deg,{{l.c}} 0%,rgba(233,213,255,.9) 50%,{{l.c}} 100%);box-shadow:0 0 6px {{l.c}},0 0 14px {{l.g}}"></div>
<span class="odot" aria-hidden="true" style="width:7px;height:7px;background:#F5F3FF;box-shadow:0 0 8px 3px {{l.c}};offset-path:path('{{l.path}}');animation-duration:{{l.dur}}s;animation-delay:{{l.dl}}s"></span>
</sc-for>
<sc-for list="{{cards}}" as="c" hint-placeholder-count="7">
<button class="card" onPointerDown="{{c.down}}" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" style="font:inherit;text-align:left;position:absolute;left:{{c.x}}px;top:{{c.y}}px;width:{{c.w}}px;box-sizing:border-box;padding:16px;border-radius:22px;background:linear-gradient(180deg,rgba(26,20,64,.86) 0%,rgba(13,10,36,.92) 100%);color:#F5F3FF;border:1.5px solid {{c.bd}};box-shadow:{{c.ring}};backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:grab;pointer-events:auto;display:flex;flex-direction:column;gap:8px">
<span style="display:flex;align-items:center;gap:6px;font:700 11px 'Space Grotesk';text-transform:uppercase;letter-spacing:.06em;color:{{c.tint}};text-shadow:0 0 8px {{c.glow}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.kind}}</span>
<span style="font-size:{{c.fs}}px;font-weight:700;line-height:1.3">{{c.title}}</span>
<sc-if value="{{c.lab}}" hint-placeholder-val="{{false}}"><span style="height:96px;border-radius:14px;background:rgba(14,11,38,.72);border:1px solid rgba(167,139,250,.18);display:flex;align-items:center;justify-content:center;gap:12px"><span class="mini-pl" style="width:60px;height:60px;border-radius:50%;background:conic-gradient(from 0deg,#7C3AED,#22D3EE,#7C3AED);box-shadow:0 0 24px rgba(124,58,237,.8)"></span><span style="display:flex;flex-direction:column;gap:4px;font:700 12px 'Space Grotesk'"><span style="color:#C4B5FD">D → O</span><span style="color:#67E8F9">R → A</span></span></span></sc-if>
<sc-if value="{{c.dora}}" hint-placeholder-val="{{false}}"><span style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font:700 13px 'Space Grotesk';text-align:center;color:#A5F3FC"><span style="padding:6px 0;border-radius:8px;background:rgba(6,182,212,.14);border:1px solid rgba(103,232,249,.5)">D</span><span style="padding:6px 0;border-radius:8px;background:rgba(6,182,212,.14);border:1px solid rgba(103,232,249,.5)">O</span><span style="padding:6px 0;border-radius:8px;background:rgba(6,182,212,.14);border:1px solid rgba(103,232,249,.5)">R</span><span style="padding:6px 0;border-radius:8px;background:rgba(6,182,212,.14);border:1px solid rgba(103,232,249,.5)">A</span></span></sc-if>
<sc-if value="{{c.sub}}" hint-placeholder-val="{{true}}"><span style="font-size:12px;color:#C8C4DC">{{c.subT}}</span></sc-if>
</button>
</sc-for>
<sc-if value="{{sel.on}}" hint-placeholder-val="{{false}}">
<div class="tb rsm" style="position:absolute;left:{{sel.x}}px;top:{{sel.y}}px;height:50px;padding:0 6px;box-sizing:border-box;border-radius:25px;display:flex;align-items:center;gap:4px;pointer-events:auto">
