<style>
body{margin:0;background:#06041A}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
.glass{background:rgba(24,16,64,.52);border:1px solid rgba(167,139,250,.32);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.lt .glass{background:rgba(255,255,255,.62);border-color:rgba(109,40,217,.22)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 30px rgba(124,58,237,.75)) drop-shadow(0 0 70px rgba(34,211,238,.25))}50%{filter:drop-shadow(0 0 50px rgba(124,58,237,.95)) drop-shadow(0 0 110px rgba(34,211,238,.4))}}
@keyframes stage{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.cr{transition:transform .35s cubic-bezier(.2,.9,.3,1.4),opacity .5s,filter .35s}
.cr:hover{transform:scale(1.08)}
.fl{animation:float 6s ease-in-out infinite}
.orb{animation:breathe 5s ease-in-out infinite}
.orbspin{animation:spin 120s linear infinite}
@keyframes oglow{0%,100%{filter:drop-shadow(0 0 2px rgba(196,181,253,.7)) drop-shadow(0 0 7px rgba(139,92,246,.55));opacity:.72}50%{filter:drop-shadow(0 0 3px rgba(224,242,254,.85)) drop-shadow(0 0 11px rgba(139,92,246,.75));opacity:.88}}
.orbitglow{animation:oglow 4s ease-in-out infinite;-webkit-mask-image:linear-gradient(90deg,transparent 12%,#000 30%);mask-image:linear-gradient(90deg,transparent 12%,#000 30%)}
@keyframes orun{from{offset-distance:0%}to{offset-distance:100%}}
.odot{position:absolute;left:0;top:0;border-radius:50%;offset-rotate:0deg;offset-anchor:center;animation-name:orun;animation-timing-function:linear;animation-iteration-count:infinite;pointer-events:none}
.trav{animation:spin 11s linear infinite}
.trav2{animation:spinr 16s linear infinite}
.tw{animation:twinkle 3.2s ease-in-out infinite}
.stage{animation:stage 3.4s ease-in-out infinite}
.msg{animation:rise .6s ease-out both}
.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both}
.dcard{transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.dcard:hover{transform:perspective(900px) rotateX(-6deg) rotateY(0deg) translateY(-10px)!important}
.nav a:hover{background:rgba(124,58,237,.25)}
a:focus-visible,button:focus-visible{outline:2px solid #22D3EE;outline-offset:2px}
.lt a:focus-visible,.lt button:focus-visible{outline-color:#0E7490}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shim{background:linear-gradient(90deg,rgba(124,58,237,.14) 0%,rgba(196,181,253,.32) 50%,rgba(124,58,237,.14) 100%);background-size:800px 100%;animation:shimmer 1.6s linear infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes suck{0%{transform:rotate(0deg) translateX(110px) scale(1);opacity:1}100%{transform:rotate(540deg) translateX(0) scale(.1);opacity:0}}
.suck{animation:suck 3.2s ease-in infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
.shake{animation:shake .5s ease-in-out infinite}
.ring1{animation:spin 6s linear infinite}
.ring2{animation:spinr 9s linear infinite}
@keyframes warp{0%{transform:translateX(0) scaleX(1);opacity:0}30%{opacity:1}100%{transform:translateX(-160px) scaleX(3);opacity:0}}
.warp{animation:warp 1.4s ease-in infinite}
.btnp:hover{filter:brightness(1.15)}
</style>

    ];
    var TINT = { net: ['#C4B5FD', '#8B5CF6'], k8s: ['#93C5FD', '#3B82F6'], lnx: ['#A5F3FC', '#22D3EE'], obs: ['#86EFAC', '#10B981'], dkr: ['#FDE68A', '#F59E0B'], wk: ['#F0ABFC', '#C026D3'], me: ['#F9A8D4', '#EC4899'] };
