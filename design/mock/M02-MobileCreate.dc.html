.lt .bgimg{opacity:.18}.lt .bgveil{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.85))}

.dk a{color:#C4B5FD}.lt a{color:#6D28D9}

.lt button:focus-visible,.lt a:focus-visible,.lt input:focus-visible{outline-color:#0E7490}

@keyframes bloom{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}

.rise{animation:rise .45s ease-out both}
.caret{animation:caret 1s step-end infinite}
