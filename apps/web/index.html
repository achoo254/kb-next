<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the page background runs under the iPhone notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- No Referer from any page: a share link (/l/<token>) carries its token in the address. -->
    <meta name="referrer" content="no-referrer" />
    <title>%APP_NAME%</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This page needs JavaScript. / Trang cần JavaScript để chạy.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
