# .65: /etc/nginx/conf.d/kb-office.hoandat.com.conf. The Office editor KnowFlow embeds (ranuts/document, its
# unmodified build at the tag and commit pinned in docs/office-editor.md), on its own origin: its code and service
# worker expect the site root. Cloudflare (proxied, SSL "full") -> here -> static files only, no API behind it.
# Only kb.hoandat.com may frame it; the page talks to kb by postMessage (both sides check the other's origin).

server {
    listen 80;
    listen [::]:80;
    server_name kb-office.hoandat.com;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kb-office.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    # The `combined` layout: URLs here carry no file names or contents (kb hands the bytes over by postMessage). Not
    # kb's `kb_notoken`: conf.d loads this file before kb.hoandat.com.conf, which declares that format.
    access_log /var/log/nginx/kb-office.hoandat.com.access.log;
    error_log  /var/log/nginx/kb-office.hoandat.com.error.log;

    root /var/www/kb-office/current;
    client_max_body_size 1k;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml font/ttf application/wasm;

    # The editor's own CSP is in editor.html's <meta> (wasm-unsafe-eval, blob: workers); only framing is set here.
    add_header Content-Security-Policy "frame-ancestors https://kb.hoandat.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed shell assets and fonts (files without an extension: served as font/ttf so gzip applies).
    location /assets/ {
        add_header Content-Security-Policy "frame-ancestors https://kb.hoandat.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        types { }
        default_type font/ttf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The x2t converter ships brotli-compressed already: sent as it is, never compressed again.
    location = /sdkjs/common/wasm/x2t/x2t.wasm.br {
        gzip off;
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding br always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker is checked for updates on every visit.
    location = /sw.js {
        add_header Content-Security-Policy "frame-ancestors https://kb.hoandat.com" always;
        add_header Cache-Control "no-cache" always;
    }
}
