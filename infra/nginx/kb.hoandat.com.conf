# .65: /etc/nginx/conf.d/kb.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here -> the static web app
# from the current release, and /api/, /auth/, /l/, /healthz to the Node server on loopback :5320 of this host.
# The Cloudflare real-IP restore is global on this host, so $remote_addr is the visitor's IP; the server
# trusts X-Forwarded-For from loopback only.

# The `combined` layout (the ecosystem's log reader expects it) with the Referer blanked to "-" (a page could name a
# share link there) and no query strings ($uri, not $request). This file is included from conf.d at http level, so
# the format is declared here; the name is app-specific because log_format names are global to the shared host.
log_format kb_notoken '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name kb.hoandat.com;
    # Only redirects; without its own line it would use the host's default log, request line (and token) included.
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kb.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/kb.hoandat.com.access.log kb_notoken;
    error_log  /var/log/nginx/kb.hoandat.com.error.log;

    root /var/www/kb/current/apps/web/dist;
    # API bodies are small JSON; the server accepts up to 32 KB. File uploads have their own location below.
    client_max_body_size 48k;

    # Share links carry their token in the path: the page with its link preview (/l/<token>, rendered by the server,
    # which sends the same CSP as `location /`) and the API that opens one (/api/l/<token>, /api/l/<token>/remix). They
    # go to the server and stay out of the access log, so a token never lands on disk; the error log keeps only `crit`
    # here, because an upstream error line quotes the request (and so the token). Checked before the /api/ block below.
    location ~ ^/(api/)?l/ {
        access_log off;
        error_log /var/log/nginx/kb.hoandat.com.error.log crit;
        proxy_pass http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Invite links (C19) carry their token in the path too. The page /i/<token> is the web app's: `location /` serves
    # it through try_files' fallback, so the log's $uri is /index.html, never the token. The API that reads one,
    # /api/invites/<token>, goes to the server and stays out of the logs like share links (error log at `crit`);
    # POST /api/invites/accept carries the token in its body only. Checked before the /api/ block below.
    location ~ ^/api/invites/ {
        access_log off;
        error_log /var/log/nginx/kb.hoandat.com.error.log crit;
        proxy_pass http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Uploads (C03, C16, the Office editor's saves): one file of at most 25 MB a request (26m with the form around it),
    # streamed to the server as it arrives, which refuses it the moment it passes 25 MB, instead of nginx buffering it
    # to a temp file first. Wins over the regex location below (^~).
    location ^~ /api/files {
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Downloads: GET /api/files/:id checks who may read the file, then answers X-Accel-Redirect: /_kb_files/<key> and
    # nginx sends it from disk (Node never streams it). `internal`: a request from outside never reaches it. nginx
    # reads the files through the directory's group (docs/deployment-guide.md, "Tệp tải lên"). nginx keeps the
    # server's Content-Type, Content-Disposition (attachment) and Cache-Control; the ETag is its own.
    location ^~ /_kb_files/ {
        internal;
        alias /var/lib/kb/files/;
        types { }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5320;
        proxy_set_header Host $host;
    }

    # frame-src of the CSP below names the Office editor's origin: it must equal OFFICE_EDITOR_ORIGIN of the server
    # (production default https://kb-office.hoandat.com), else the editor's frame is blocked (docs/office-editor.md).
    # Every non-API response carries these. nginx drops inherited add_header lines in a block that declares
    # its own, so /assets/ repeats the ones it needs. The API stays out: the server (helmet) sends its own.
    # Cloudflare Web Analytics is allowed in script-src/connect-src (the privacy page says so). The pages have no
    # inline script to allow (apps/web/index-html.test.ts keeps it that way). Images may also come
    # from Google and GitHub: the account pictures shown in the header's account menu.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-src https://kb-office.hoandat.com; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # index.html (also as the SPA fallback) and the other unhashed files are revalidated on every visit, so
        # a browser never keeps a page that points at chunks of a previous release.
        add_header Cache-Control "no-cache" always;

        try_files $uri /index.html;

        # Hashed build files: cached for a year; a miss is a real 404, never index.html served as JavaScript.
        # This block sets its own headers, so it repeats the ones that matter for scripts.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files $uri =404;
        }
    }
}
